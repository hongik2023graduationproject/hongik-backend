version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hongik
      POSTGRES_PASSWORD: hongik
      POSTGRES_DB: hongik
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hongik -d hongik"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: hongik-backend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - ENV=production
      - PORT=8080
      - INTERPRETER_PATH=/app/HongIk
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - MAX_CONCURRENT_EXEC=5
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://hongik:hongik@postgres:5432/hongik?sslmode=disable

volumes:
  postgres-data:
  redis-data:
